defaults:
  - _self_

seed: 42
model_type: "Transformer"
loss_type: "DynamASCL"
project_name: "MusicTag"
task_name: "${model_type}_${loss_type}"

data:
  split_dir: "D:\\AAAAAAAAAA_emotion\\Code\\EmoMusicRec\\data\\MTG-Jamendo"
  feature_dir: "D:\\AAAA_audio_dataset\\mtg-jamendo\\MERT_95M_30s"
  tag_path: "D:\\AAAA_audio_dataset\\mtg-jamendo\\meta\\tag_recsys.npy"

  batch_size: 64
  num_workers: 4
  max_seq_len: 12
task:
  num_genres: 10
  num_instruments: 7
  num_moods: 9

weights:
  genre: 1.0
  instrument: 1.0
  mood: 1.0
model:
  input_dim: 768
  hidden_dims: [512, 256]
  dropout: 0.5
  learning_rate: 1e-4
  weight_decay: 1e-4
  latent_dim: 128

training:
  max_epochs: 300
  accelerator: 'gpu'
  devices: [0]

  early_stopping:
    monitor: 'val_loss'
    patience: 10
    mode: 'min'

  scheduler:
    monitor: 'val_loss'
    patience: 8
    factor: 0.5

save:
  result_dir: "D:\\AAAAAAAAAA_emotion\\Code\\EmoMusicRec\\outputs\\results"
  checkpoint_dir: "D:\\AAAAAAAAAA_emotion\\Code\\EmoMusicRec\\outputs\\checkpoints"
  log_dir: "D:\\AAAAAAAAAA_emotion\\Code\\EmoMusicRec\\outputs\\tb_logs"

hydra:
  run:
    dir: .
  output_subdir: null
  job_logging:
    root:
      handlers: [console]
    handlers:
      file:
        class: logging.FileHandler
        filename: NUL